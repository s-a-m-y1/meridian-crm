apiVersion: v1
kind: Secret
metadata:
  name: crm-secrets
  namespace: crm
type: Opaque
stringData:
  PGUSER: "crm_user"
  PGPASSWORD: "CHANGE_ME_IN_PRODUCTION"
  PGDATABASE: "crm_db"
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  JWT_SECRET: "CHANGE_ME_MIN_32_CHARS_IN_PRODUCTION"
  REFRESH_SECRET: "CHANGE_ME_MIN_32_CHARS_IN_PRODUCTION"
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  CORS_ORIGIN: "https://yourdomain.com"