apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crm

resources:
- ../../base

patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          memory: "512Mi"
          cpu: "500m"
        limits:
          memory: "1Gi"
          cpu: "2000m"
  target:
    kind: Deployment
    name: backend

images:
- name: ghcr.io/your-org/crm-backend
  newTag: production-latest
- name: ghcr.io/your-org/crm-frontend
  newTag: production-latest

replicas:
- name: backend
  count: 5
- name: frontend
  count: 5