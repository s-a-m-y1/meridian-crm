apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crm-staging

resources:
- ../../base

patches:
- patch: |-
    - op: replace
      path: /metadata/namespace
      value: crm-staging
  target:
    kind: Namespace

commonLabels:
  environment: staging

images:
- name: ghcr.io/your-org/crm-backend
  newTag: staging-latest
- name: ghcr.io/your-org/crm-frontend
  newTag: staging-latest

replicas:
- name: backend
  count: 2
- name: frontend
  count: 2