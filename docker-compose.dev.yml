version: '3.8'

services:
  # PostgreSQL Database (Development)
  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres-dev
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
      POSTGRES_DB: crm_db
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./backend/database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm-dev-network

  # Redis Cache & Queue (Development)
  redis:
    image: redis:7-alpine
    container_name: crm-redis-dev
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - crm-dev-network

  # LocalStack S3-compatible storage (version 2.x - no license required)
  localstack:
    image: localstack/localstack:2.3.0
    container_name: crm-localstack-dev
    environment:
      SERVICES: s3
      DEBUG: 1
      DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - localstack_dev_data:/var/lib/localstack
      - ./localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh
    ports:
      - "4566:4566"  # LocalStack edge port
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - crm-dev-network

  # Backend API (Development with hot reload)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: crm-backend-dev
    environment:
      NODE_ENV: development
      PORT: 4000
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: crm_user
      PGPASSWORD: crm_password
      PGDATABASE: crm_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      JWT_SECRET: dev-jwt-secret-change-in-production-min-32-chars
      REFRESH_SECRET: dev-refresh-secret-change-in-production-min-32-chars
      CORS_ORIGIN: http://localhost:3000
      # S3/LocalStack Configuration
      S3_ENDPOINT: http://localstack:4566
      S3_REGION: us-east-1
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_BUCKET: crm-files
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_ENDPOINT: http://localhost:4566
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/nest-cli.json:/app/nest-cli.json
    ports:
      - "4000:4000"
      - "9229:9229" # Debug port
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    command: npm run start:debug
    networks:
      - crm-dev-network

  # Frontend (Development with hot reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: crm-frontend-dev
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_API_URL_INTERNAL: http://backend:4000/api/v1
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev
    networks:
      - crm-dev-network

volumes:
  postgres_dev_data:
  redis_dev_data:
  localstack_dev_data:

networks:
  crm-dev-network:
    driver: bridge
